<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Expo QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fafaf7; }
  h2 { color: #1a1a2e; }
  #qr { margin: 24px; padding: 20px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  p { color: #555; font-size: 14px; }
  code { background: #f0f0f0; padding: 4px 10px; border-radius: 6px; font-size: 15px; }
</style>
</head>
<body>
  <h2>📱 Escaneie com o Expo Go</h2>
  <div id="qr"></div>
  <p>URL: <code>exp://192.168.0.44:8081</code></p>
  <p style="font-size:12px;color:#999">Abra a câmera do iPhone e aponte para o QR code acima</p>
  <script>
    new QRCode(document.getElementById("qr"), {
      text: "exp://192.168.0.44:8081",
      width: 256,
      height: 256,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
